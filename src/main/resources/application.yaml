server:
  port: 8765

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: self-test
              uri: http://localhost:${server.port:8765}
              predicates:
                - Path=/proxy/**
              filters:
                - StripPrefix=1
            - id: core
              uri: ${CORE_BASE_URL}
              predicates:
                - Path=/api/**,/hello,/hello/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**
              filters:
                - TokenRelay=
            - id: frontend
              uri: ${FRONTEND_BASE_URL:http://localhost:5173}
              predicates:
                - Path=/,/login,/register,/assets/**
              filters:
                - RemoveRequestHeader=Authorization
          default-filters:
            - RemoveRequestHeader=Cookie
            - RemoveResponseHeader=Set-Cookie

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gateway
            client-secret: ${DEV_CLIENT_SECRET}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_SCHEME}://keycloak:${KEYCLOAK_PORT}/realms/DACS

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
